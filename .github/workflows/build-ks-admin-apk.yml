name: Build KS Admin Android APK

on:
  push:
    branches: [ guest-access-prototype-20261106 ]
    paths:
      - 'ks-admin-android/**'
      - '.github/workflows/build-ks-admin-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: ks-admin-android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KS-AVIATION-Hizli-Is-Bitirici
          path: ks-admin-android/app/build/outputs/apk/debug/app-debug.apk
